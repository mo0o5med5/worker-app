<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>أنا عامل - خدمات العمالة</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="worker.css" />
</head>
<body>

  <div class="overlay"></div>

  <header class="topbar">
    <a class="back" href="index.html">← رجوع</a>
    <div class="brand">👷‍♂️ لوحة العامل</div>
  </header>

  <main class="wrap">

    <section class="card">
      <h2>بيانات العامل</h2>

      <div class="grid">
        <div class="field">
          <label>اسم العامل</label>
          <input id="wName" type="text" placeholder="مثال: محمد" />
        </div>

        <div class="field">
          <label>رقم الهاتف (واتساب)</label>
          <input id="wPhone" type="text" placeholder="9715xxxxxxxx" />
        </div>

        <div class="field">
          <label>الخدمة</label>
          <select id="wService">
            <option>تحميل أثاث</option>
            <option>فك وتركيب</option>
            <option>نقل خفيف</option>
            <option>مساعدة عامة</option>
          </select>
        </div>

        <div class="field">
          <label>المنطقة</label>
          <input id="wArea" type="text" placeholder="مثال: دبي - القرهود" />
        </div>
      </div>

      <div class="row">
        <button class="btn primary" onclick="saveWorker()">💾 حفظ</button>
        <button class="btn ghost" onclick="getWorkerLocation()">📍 جلب موقعي</button>

        <label class="switch">
          <input id="wOnline" type="checkbox" onchange="toggleOnline()" />
          <span class="slider"></span>
          <span class="txt">متاح الآن</span>
        </label>
      </div>

      <p id="wStatus" class="status"></p>
    </section>

    <section class="card">
      <div class="head">
        <h2>طلبات قريبة</h2>
        <button class="btn small" onclick="mockNewRequest()">➕ طلب تجريبي</button>
      </div>

      <div id="requests" class="requests"></div>
    </section>

  </main>

  <script src="worker.js"></script>
</body>
</html>
