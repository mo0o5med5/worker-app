<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>خدمات العمالة</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="overlay"></div>

  <div class="card">
    <h1>🚚 خدمات العمالة</h1>

    <select id="service">
      <option>تحميل أثاث</option>
      <option>فك وتركيب</option>
      <option>نقل خفيف</option>
      <option>مساعدة عامة</option>
    </select>

    <div class="location-box">
      <span class="pin">📍</span>
      <input id="location" type="text" placeholder="موقعك الحالي" />
      <button class="gps" onclick="getLocation()">📡</button>
    </div>

    <button class="order-btn" onclick="orderWorker()">طلب عامل</button>

    <p id="status"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
