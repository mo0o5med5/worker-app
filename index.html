<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>خدمات العمالة</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="card">
    <h1>🚚 خدمات العمالة</h1>

    <select id="service">
      <option>تحميل أثاث</option>
      <option>فك وتركيب</option>
      <option>نقل خفيف</option>
      <option>مساعدة عامة</option>
    </select>

    <div class="location-box">
      <input id="location" type="text" placeholder="📍 موقعك الحالي" />
      <button onclick="getLocation()">📍</button>
    </div>

    <button class="order-btn" onclick="orderWorker()">طلب عامل</button>

    <p id="status"></p>

    <button id="whatsappBtn" class="wa-btn" style="display:none;" onclick="openWhatsApp()">
      تواصل ومتابعة مع العامل
    </button>
  </div>

  <script src="script.js"></script>
</body>
</html>
