<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>خدمات العمالة</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="overlay"></div>

  <main class="card">
    <h1>🚚 خدمات العمالة</h1>

    <select id="service">
      <option>تحميل أثاث</option>
      <option>فك وتركيب</option>
      <option>نقل خفيف</option>
      <option>مساعدة عامة</option>
    </select>

    <div class="location-box">
      <span class="pin">📍</span>
      <input id="location" type="text" placeholder="موقعك الحالي" />
      <button id="gpsBtn" class="gps" type="button" onclick="getLocation()">📡</button>
    </div>

    <button class="order-btn" onclick="orderWorker()">طلب عامل</button>

    <p id="status"></p>

    <button id="whatsappBtn" class="wa-btn" style="display:none;" onclick="openWhatsApp()">
      تواصل ومتابعة مع العامل
    </button>

    <a class="worker-link" href="worker.html">👷‍♂️ أنا عامل</a>
  </main>

  <script src="script.js"></script>
</body>
</html>
